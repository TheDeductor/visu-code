schema: 1
title: Netflix Streaming Backend
type: graph
level: feature
direction: right
summary: Medium-detail backend architecture for Netflix video playback and content delivery.
walkthrough:
  - focus: [client-device]
    text: User taps Play on a movie in the Netflix client app.
  - focus: [zuul-gateway]
    text: Zuul edge gateway authenticates user token and routes the request.
  - focus: [playback-api, session-cache]
    text: Playback service checks subscription entitlements and active session in cache.
  - focus: [catalog-service, user-db]
    text: Catalog service pulls metadata and bookmark state from Cassandra database.
  - focus: [open-connect]
    text: Open Connect CDN server nearest to the user streams the optimized video chunks.
nodes:
  - id: client-device
    label: Netflix App
    kind: ui
    status: planned
    description: Client application running on Smart TVs or mobile devices initiating playback.
    plain: The app on your TV or phone where you browse and press Play.
  - id: zuul-gateway
    label: Zuul API Gateway
    kind: service
    status: planned
    description: Edge routing proxy handling authentication, routing, and traffic shaping in AWS.
    plain: The front door that checks who you are and routes your request.
  - id: catalog-service
    label: Catalog Service
    kind: service
    status: planned
    description: Microservice managing movie metadata, localized assets, and recommendations.
    plain: Finds movie titles, covers, and descriptions.
  - id: user-db
    label: Cassandra Database
    kind: database
    status: planned
    description: Distributed NoSQL database for viewing history, bookmarks, and account records.
    plain: Database storing what you watched and where you paused.
  - id: playback-api
    label: Playback Service
    kind: service
    status: planned
    description: Core orchestration service validating device DRM, subscriptions, and playback manifests.
    plain: Confirms your subscription is active and provides your stream ticket.
  - id: session-cache
    label: EVCache Cluster
    kind: cache
    status: planned
    description: High-throughput in-memory cache storing session tokens and profile state.
    plain: Ultra-fast memory cache keeping your login details ready.
  - id: open-connect
    label: Open Connect CDN
    kind: storage
    status: planned
    description: Custom content delivery appliances inside ISP networks serving video segments.
    plain: Local streaming servers near your house sending the actual video chunks.
edges:
  - from: client-device
    to: zuul-gateway
    kind: calls
  - from: zuul-gateway
    to: catalog-service
    kind: calls
  - from: catalog-service
    to: user-db
    label: read metadata
    kind: reads
  - from: zuul-gateway
    to: playback-api
    kind: calls
  - from: playback-api
    to: session-cache
    label: check session
    kind: reads
  - from: playback-api
    to: open-connect
    label: assign closest OCA
    kind: data
