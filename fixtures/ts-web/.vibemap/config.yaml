schema: 1
project:
  name: ts-web
tracking:
  # every-change | per-phase | manual | off
  mode: every-change
  # overview | feature | detail
  granularity: feature
  changeLog: true
agents: [codex]
paths:
  include:
    - "**/*"
  exclude:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - ".git/**"
    - ".vibemap/**"
    - "**/*.test.*"
    - "**/*.spec.*"
limits:
  softMaxNodes: 15
  hardMaxNodes: 30
  maxLabelChars: 40
  maxDescriptionChars: 200
validation:
  strict: false
  requireRefs: true
editing:
  autoLockHumanEdits: true
  newNodeStatus: planned
viewer:
  port: 4317
  host: 127.0.0.1
  open: true
  defaultTab: maps
  beginnerMode: false
history:
  source: git
  journalMaxEntries: 500
coverage:
  target: 60
glossary:
  JWT: A signed token that proves who you are.
privacy:
  llm: none
  telemetry: false
