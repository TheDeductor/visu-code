<g class="edge"><path d="M 401 116 C 441 116, 421 58, 461 58" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="381.32" y="65.5" width="99.36000000000001" height="23" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/><text x="431" y="77" text-anchor="middle" dominant-baseline="middle" fill="#495057" font-size="13" font-weight="500"><tspan x="431" dy="0">save session</tspan></text></g></g>
