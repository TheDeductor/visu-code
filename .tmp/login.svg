<text x="24" y="48" font-family=""Comic Sans MS", "Segoe Print", "Bradley Hand", cursive" font-size="12" fill="#6c757d">How a person signs in with email and password.</text>
<g transform="translate(0,52)" font-family=""Comic Sans MS", "Segoe Print", "Bradley Hand", cursive">
<rect x="4" y="40" width="192" height="126" rx="18" fill="#f1f3f5" fill-opacity="0.55" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6 5"/>
