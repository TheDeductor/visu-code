<g class="node"><ellipse cx="537.5" cy="174" rx="70" ry="28" fill="#b2f2bb" fill-opacity="0.92" stroke="#343a40" stroke-width="2"/><text x="537.5" y="174" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e" font-size="16" font-weight="500"><tspan x="537.5" dy="0">User table</tspan></text>
