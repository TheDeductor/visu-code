schema: 1
title: Simple User Flow
level: feature
direction: right
summary: "Simple step-by-step user flow without groups or arrow labels, featuring a guidance sticky note."
type: graph
nodes:
  - id: install-init
    label: 1. Install & Init
    kind: process
    status: built
    description: Install CLI globally and run vibemap init to scaffold .vibemap/ configuration.
    plain: Run once to set up the project.
    refs:
      - path: src/core/init.ts
        symbol: initProject
  - id: bootstrap-maps
    label: 2. Bootstrap Maps
    kind: process
    status: built
    description: Scans code and generates BOOTSTRAP_PROMPT.md for AI agent to create maps.
    plain: Creates initial architecture maps.
    refs:
      - path: src/core/bootstrap.ts
        symbol: bootstrapProject
  - id: launch-viewer
    label: 3. Launch Viewer
    kind: process
    status: built
    description: Starts local server and opens browser canvas with live reload.
    plain: Live interactive browser canvas.
    refs:
      - path: src/server/server.ts
        symbol: VibeMapServer
  - id: explore-arch
    label: 4. Explore Architecture
    kind: ui
    status: built
    description: Pan, zoom, inspect nodes, review evidence, and check connected files.
    plain: Interactive exploration of components.
    refs:
      - path: viewer/src/App.tsx
  - id: edit-code-maps
    label: 5. Edit Code & Maps
    kind: process
    status: built
    description: Modify code and update maps through visual canvas edits or agent patches.
    plain: Direct edits or AI agent patches.
    refs:
      - path: src/core/ops.ts
        symbol: applyOpsToContent
  - id: validate-check
    label: 6. Validate with Check
    kind: process
    status: built
    description: Run vibemap check to verify invariants, references, and zero schema errors.
    plain: Enforces zero-error consistency.
    refs:
      - path: src/core/validate.ts
        symbol: validateProject
  - id: record-changes
    label: 7. Record Changes
    kind: process
    status: built
    description: Record semantic change entries with visual diffs before committing.
    plain: Document change reasons and deltas.
    refs:
      - path: src/core/changes.ts
        symbol: buildChangeBody
  - id: sticky-note
    label: "Sticky Note: Guidelines"
    kind: note
    status: built
    description: "Key rules: maps stay synced with code; human edits are auto-locked; run check before committing."
    plain: "• Maps stay synced with code\n• Human edits auto-lock\n• Run check before commit"
    refs:
      - path: .vibemap/AGENT_GUIDE.md
edges:
  - from: install-init
    to: bootstrap-maps
    kind: flow
  - from: bootstrap-maps
    to: launch-viewer
    kind: flow
  - from: launch-viewer
    to: explore-arch
    kind: flow
  - from: explore-arch
    to: edit-code-maps
    kind: flow
  - from: edit-code-maps
    to: validate-check
    kind: flow
  - from: validate-check
    to: record-changes
    kind: flow
  - from: sticky-note
    to: explore-arch
    kind: reads
